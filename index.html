t-weight:400; }   .cta .arrow{     transition: transform 0.2s ease;   }   .cta:hover .arrow{ transform: translateX(3px); }    /* contact modal */   .modal-overlay{     position:fixed;     inset:0;     z-index:10;     display:flex;     align-items:center;     justify-content:center;     padding:24px;     background: rgba(6,10,18,0.72);     backdrop-filter: blur(3px);     opacity:0;     visibility:hidden;     transition: opacity 0.25s ease;   }   .modal-overlay.is-open{     opacity:1;     visibility:visible;   }   .modal{     position:relative;     width:100%;     max-width: 420px;     background: var(--navy-800);     border: 1px solid var(--line);     border-radius: 10px;     box-shadow: 0 24px 60px rgba(0,0,0,0.45);     padding: 36px 32px 30px;     transform: translateY(8px);     transition: transform 0.25s ease;   }   .modal-overlay.is-open .modal{     transform: translateY(0);   }   .modal-close{     position:absolute;     top:16px;     right:16px;     background:none;     border:none;     color: var(--cream-300);     font-size:14px;     line-height:1;     cursor:pointer;     padding:6px;     transition: color 0.2s ease;   }   .modal-close:hover, .modal-close:focus-visible{     color: var(--gold-300);   }   .modal-close:focus-visible{     outline: 2px solid var(--gold-500);     outline-offset: 2px;     border-radius: 4px;   }   .modal-eyebrow{     font-family:'Inter', sans-serif;     font-size:10px;     font-weight:600;     letter-spacing:0.18em;     text-transform:uppercase;     color: var(--gold-300);     margin:0 0 10px 0;   }   .modal-title{     font-family:'Fraunces', serif;     font-weight:500;     font-size: clamp(1.35rem, 4vw, 1.6rem);     color: var(--cream-100);     margin: 0 0 22px 0;   }   .field{     display:block;     margin-bottom:16px;   }   .field span{     display:block;     font-family:'Inter', sans-serif;     font-size:11px;     font-weight:600;     letter-spacing:0.08em;     text-transform:uppercase;     color: var(--cream-300);     margin-bot span>             <input type="text" name="name" required autocomplete="name">           </label>           <label class="field">             <span>Email</span>             <input type="email" name="email" required autocomplete="email">           </label>           <label class="field">             <span>Message</span>             <textarea name="message" rows="4" required></textarea>           </label>            <input type="hidden" name="_subject" value="New message from the MissyVe coming soon page">            <button type="submit" class="submit-btn" id="submitBtn">             <span class="submit-label">Send message</span>           </button>            <p class="form-error" id="formError" role="alert"></p>         </form>       </div>        <div class="modal-success" id="modalSuccess" hidden>         <p class="success-title">Message sent</p>         <p class="success-text">Thanks for reaching out — we'll be in touch soon.</p>       </div>     </div>   </div> </div>  <script> (function(){   var overlay = document.getElementById('modalOverlay');   var openBtn = document.getElementById('openContact');   var closeBtn = document.getElementById('closeContact');   var form = document.getElementById('contactForm');   var submitBtn = document.getElementById('submitBtn');   var errorEl = document.getElementById('formError');   var body = document.getElementById('modalBody');   var success = document.getElementById('modalSuccess');   var lastFocused = null;    function openModal(){     lastFocused = document.activeElement;     overlay.classList.add('is-open');     document.body.style.overflow = 'hidden';     var firstField = form.querySelector('input, textarea');     if(firstField){ firstField.focus(); }   }    function closeModal(){     overlay.classList.remove('is-open');     document.body.style.overflow = '';     if(lastFocused){ lastFocused.focus(); }   }    openBtn.addEventListener('click', openModal);   closeBtn.addEventListener('click', closeModal);    overlay.addEventListener('click', function(e){     if(e.target === overlay){ closeModal(); }   });    document.addEventListener('keydown', function(e){     if(e.key === 'Escape' && overlay.classList.contains('is-open')){       closeModal();     }   });    form.addEventListener('submit', function(e){     e.preventDefault();     errorEl.textContent = '';     submitBtn.disabled = true;     submitBtn.querySelector('.submit-label').textContent = 'Sending…';      var data = {       name: form.name.value,       email: form.email.value,       message: form.message.value,       _subject: form._subject.value     };      fetch('https://formsubmit.co/ajax/melissa@missyve.co', {       method: 'POST',       headers: {         'Content-Type': 'application/json',         'Accept': 'application/json'       },       body: JSON.stringify(data)     })     .then(function(res){ return res.json().then(function(json){ return { ok: res.ok, json: json }; }); })     .then(function(result){       if(!result.ok){ throw new Error('Request failed'); }       body.hidden = true;       success.hidden = false;       form.reset();     })     .catch(function(){       errorEl.textContent = "Something went wrong — please try again, or email melissa@missyve.co directly.";     })     .finally(function(){       submitBtn.disabled = false;       submitBtn.querySelector('.submit-label').textContent = 'Send message';     });   }); })(); </script>  </body> </html>
